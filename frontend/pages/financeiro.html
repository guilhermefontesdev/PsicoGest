<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <script src="/js/api.js"></script>
    <script>proteger()</script>
    <div class="layout">
        <script>sidebar('financeiro')</script>
        <main class="main">
            <div class="topbar">
                <h2>Financeiro</h2>
            </div>
            <section class="grid two">
                <div class="card">
                    <h3>Lançamento</h3>
                    <form id="form" class="form"><select name="tipo">
                            <option value="receita">Receita</option>
                            <option value="despesa">Despesa</option>
                        </select><input name="descricao" placeholder="Descrição" required><input name="valor"
                            type="number" step="0.01" placeholder="Valor" required><select name="forma_pagamento">
                            <option>Pix</option>
                            <option>Cartão</option>
                            <option>Dinheiro</option>
                            <option>Convênio</option>
                        </select><select name="status">
                            <option value="pago">Pago</option>
                            <option value="pendente">Pendente</option>
                            <option value="cancelado">Cancelado</option>
                        </select><input name="data_pagamento" type="date"><button class="btn">Salvar</button></form>
                </div>
                <div class="card">
                    <h3>Movimentações</h3>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Descrição</th>
                                <th>Valor</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/financeiro.js"></script>
</body>

</html>
