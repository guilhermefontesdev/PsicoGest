<!doctype html>
<html lang="pt-BR">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <script src="/js/api.js"></script>
    <script>proteger()</script>
    <div class="layout">
        <script>sidebar('relatorios')</script>
        <main class="main">
            <div class="topbar">
                <h2>Relatórios</h2><button class="btn light" onclick="window.print()">Exportar PDF</button>

                </div>
                <div class="card">
                    <h3>Indicadores</h3>

                        <tbody id="indicadores"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/relatorios.js"></script>

</html>
